<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Parakeet AI - Interview Overlay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "on-surface": "#e3e2e2",
                        "tertiary-fixed": "#e4e2e1",

                        "on-error": "#690005",
                        "surface-dim": "#121414",
                        "error-container": "#93000a",
                        "surface-container-highest": "#343535",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-container-high": "#292a2a",
                        "surface-container": "#1e2020",
                        "error": "#ffb4ab",
                        "surface": "#121414",
                        "on-primary-container": "#005025",
                        "secondary-container": "#474746",
                        "on-tertiary-container": "#444444",
                        "on-secondary-container": "#b7b5b4",
                        "primary-fixed-dim": "#66dd8b",
                        "secondary-fixed-dim": "#c8c6c5",
                        "inverse-surface": "#e3e2e2",
                        "primary": "#6ee591",
                        "primary-fixed": "#83fba5",
                        "secondary-fixed": "#e5e2e1",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#474747",
                        "tertiary-fixed-dim": "#c8c6c6",
                        "surface-bright": "#383939",
                        "on-secondary": "#313030",
                        "primary-container": "#50c878",
                        "secondary": "#c8c6c5",
                        "tertiary": "#cfcccc",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#3e4a3f",
                        "surface-container-lowest": "#0d0e0f",
                        "on-tertiary": "#303030",

                    },
                    "borderRadius": {

                    "spacing": {
                        "sidebar-width": "260px",
                        "md": "16px",
                        "container-max": "1440px",

                        "unit": "4px",

                    },
                    "fontFamily": {

                }
            }
        }

<style>
        body {
            /* Dimmed background to simulate overlay */
            background-color: rgba(12, 12, 12, 0.8);
            background-image: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }
        
        .glass-panel {
            background: rgba(45, 45, 45, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }

        .kbd-chip {
            background-color: #121414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #bdcabc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .overlay-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e3e2e2;
            transition: all 0.2s ease;
        }
        
        .overlay-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .overlay-btn.active {
            background: rgba(80, 200, 120, 0.1);
            border-color: #50C878;
            color: #50C878;
        }
        
        .overlay-btn.danger {
            background: rgba(255, 59, 48, 0.1);
            border-color: rgba(255, 59, 48, 0.2);
            color: #ffb4ab;
        }
    </style>
</head>
<body class="font-body-base text-on-surface antialiased">
<!-- Top Control Bar (Pill) -->
<div class="glass-panel rounded-full px-4 py-2 flex items-center gap-4 mb-4 z-50">
<!-- Status Indicators -->
<div class="flex items-center gap-2 pr-2 border-r border-outline-variant">
<div class="relative flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[18px] text-on-surface">desktop_windows</span>
<span class="absolute top-0 right-0 w-2 h-2 rounded-full bg-error"></span>
</div>
<div class="relative flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[18px] text-on-surface">mic</span>
<span class="absolute top-0 right-0 w-2 h-2 rounded-full bg-error"></span>
</div>
</div>
<!-- Primary Actions -->
<div class="flex items-center gap-2">
<button class="overlay-btn active flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium">
                Answer
                <span class="kbd-chip text-primary border-primary/30 bg-surface-container-high rounded-full">⌘ ↵</span>
</button>
<button class="overlay-btn flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium">
                Screenshot
                <span class="kbd-chip bg-surface-container-high rounded-full">⌘ ⇧ ↵</span>
</button>
<button class="overlay-btn flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium border-dashed">
                Chat
                <span class="kbd-chip bg-surface-container-high rounded-full">⌘ ⇧ ⌫</span>
</button>
</div>
<!-- Utility Actions -->
<div class="flex items-center gap-2 pl-2 border-l border-outline-variant">
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">open_with</span>
</button>
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">push_pin</span>
</button>
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">settings</span>
</button>
<button class="overlay-btn danger flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium ml-2 bg-error text-on-error border-none hover:bg-error/90">
                End
            </button>
</div>
</div>
<!-- Secondary Input/Context Bar -->
<div class="glass-panel rounded-full px-4 py-2 flex items-center gap-3 mb-6 z-40 max-w-[800px] w-full mx-4">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container text-primary-container">
<span class="material-symbols-outlined text-[18px]">graphic_eq</span>
</div>
<div class="flex-1 flex items-center gap-2 overflow-hidden px-2">
<span class="overlay-btn px-3 py-1 rounded-full text-sm whitespace-nowrap opacity-70">How would you</span>
<span class="overlay-btn px-3 py-1 rounded-full text-sm whitespace-nowrap opacity-70">design a rate</span>
<span class="overlay-btn px-3 py-1 rounded-full text-sm whitespace-nowrap opacity-70">limiter for a</span>
<span class="overlay-btn px-3 py-1 rounded-full text-sm whitespace-nowrap opacity-70">public API?</span>
</div>
<div class="flex items-center gap-2 border-l border-outline-variant pl-3">
<button class="overlay-btn flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium">
                Clear
                <span class="kbd-chip bg-surface-container-high rounded-full">⌘ ⇧ ⌫</span>
</button>
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">push_pin</span>
</button>
</div>
</div>
<!-- Main Content Window (Answer) -->
<div class="glass-panel rounded-2xl w-full max-w-[900px] mx-4 overflow-hidden flex flex-col z-30">
<!-- Window Header Controls -->
<div class="flex items-center justify-between px-4 py-3 border-b border-white/5 bg-surface-container-low/50">
<div class="flex gap-2">
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
</button>
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<div class="flex items-center gap-2"><div class="flex items-center gap-2 mr-4 px-3 py-1 rounded-full bg-surface-container/50 border border-white/5"><label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant opacity-70">Opacity</label><input class="w-20 h-1 bg-outline-variant rounded-full appearance-none cursor-pointer accent-primary" max="100" min="20" type="range" value="60"></div>
<button class="overlay-btn flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium">
                    Clear <span class="kbd-chip scale-90 origin-right bg-surface-container-high rounded-full">⌘ ⇧ ⌫</span>
</button>
<button class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">open_in_full</span>
</button>
</div>
</div>
<!-- Question Section -->
<div class="px-6 py-5 border-b border-white/5 bg-[#1A1A1A]">
<div class="flex items-start justify-between gap-4">
<div class="flex gap-3">
<span class="material-symbols-outlined text-tertiary-container mt-1">forum</span>
<h2 class="font-headline-md text-headline-md text-on-surface">
<span class="text-tertiary-container">Question:</span> How would you design a rate limiter for a public API?
                    </h2>
</div>
<button class="text-on-surface-variant hover:text-primary-container transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
</button>
</div>
</div>
<!-- Answer Section -->
<div class="px-6 py-6 bg-[#1A1A1A] flex-1"><div class="flex flex-col gap-6 py-2"><div class="flex items-center gap-3"><div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span><span class="w-2 h-2 rounded-full bg-primary/60 animate-pulse"></span><span class="w-2 h-2 rounded-full bg-primary/30 animate-pulse"></span></div><span class="text-sm font-medium text-primary">Generating answer...</span></div><div class="space-y-3"><div class="h-3.5 bg-surface-container-highest/60 rounded w-5/6 animate-pulse"></div><div class="h-3.5 bg-surface-container-highest/40 rounded w-3/4 animate-pulse"></div><div class="h-3.5 bg-surface-container-highest/20 rounded w-1/2 animate-pulse"></div></div></div></div>
<!-- Footer Info -->
<div class="px-6 py-3 bg-[#121414] border-t border-white/5 flex items-center justify-between text-xs text-on-surface-variant"><div class="flex items-center gap-2"><span class="flex h-1.5 w-1.5 rounded-full bg-primary animate-ping"></span><span class="text-xs text-on-surface-variant">Generating...</span></div><div class="flex items-center gap-2"><span class="text-[11px] font-code-block text-on-surface-variant opacity-60">ESC to cancel</span></div></div>
</div>






</body></html>
